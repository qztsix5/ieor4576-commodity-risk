[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ieor4576-commodity-risk"
version = "0.1.0"
description = "Replication of Bakshi, Gao and Rossi (2019)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.0", "scipy", "statsmodels", "matplotlib", "pyyaml", "wrds"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
